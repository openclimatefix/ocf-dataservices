[project]
name = "metoffice-data"
version = "0.1.0"
description = "MetOffice Weather DataHub pipeline assets."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "xarray",
    "pandera",
    "schemas",
    "cfgrib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metoffice_data"]

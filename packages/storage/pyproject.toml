[project]
name = "storage"
version = "0.1.0"
description = "Shared Icechunk storage writer and standalone CLI runner for data packages"
readme = "README.md"
authors = [
    { name = "Open Climate Fix Team", email = "info@openclimatefix.org" }
]
requires-python = ">=3.14"
dependencies = [
    "icechunk>=2.1.1",
    "numpy",
    "schemas",
    "xarray>=2026.1.0",
    "zarr>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storage"]
